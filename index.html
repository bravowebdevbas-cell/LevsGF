<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Google Fonts -->

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #4a4a4a;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        .active {
            display: flex;
        }

        /* Page 1: Landing Page */
        h1.title {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: #ff3366;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        p.subtitle {
            font-size: 1.4rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 65, 108, 0.4);
        }

        /* Page 2: Mixed Media Slideshow */
        .slideshow-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px 0 20px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            background-color: #000;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        .slide.active-slide {
            display: flex;
            animation: fadeImg 0.5s ease-in-out;
        }

        .slide img, .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            outline: none;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 12px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s ease;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.4);
            user-select: none;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .next { right: 15px; }
        .prev { left: 15px; }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Page 3: Final Video */
        .video-container {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 15px;
            outline: none;
        }

        /* Confetti decoration */
        .confetti-icon {
            font-size: 4rem;
            color: #ff3366;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeImg {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<!-- SCREEN 3: Final Main Video -->
<div id="screen3" class="screen">

        <iframe
            src="https://drive.google.com/file/d/1CHRwkVErLH3btDWip2xUDZIxiuPwYB13/preview"

            allowfullscreen>

</div>

    <script>
        // Screen Navigation
        function goToScreen(screenNumber) {
            // Pause any playing slideshow videos when leaving screen 2
            if (screenNumber !== 2) {
                document.querySelectorAll('.slideshow-container video').forEach(v => v.pause());
            }

            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById('screen' + screenNumber).classList.add('active');

            // Auto-play final video on screen 3
            if (screenNumber === 3) {
                const video = document.getElementById('birthdayVideo');
                if (video) {
                    video.play();
                }
            }
        }

        // Slideshow Logic supporting Photos & Videos
        let slideIndex = 0;
        const slides = document.getElementsByClassName("slide");

        function changeSlide(n) {
            // Pause any video on the current slide before switching
            let currentVideo = slides[slideIndex].querySelector('video');
            if (currentVideo) {
                currentVideo.pause();
            }

            slideIndex += n;
            if (slideIndex >= slides.length) { slideIndex = 0; }
            if (slideIndex < 0) { slideIndex = slides.length - 1; }

            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active-slide");
            }

            slides[slideIndex].classList.add("active-slide");
        }
    </script>
